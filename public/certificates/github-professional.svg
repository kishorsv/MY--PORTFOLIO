<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 850" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="50%" stop-color="#161b22" />
      <stop offset="100%" stop-color="#0a0d12" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0b429" />
      <stop offset="50%" stop-color="#f7d070" />
      <stop offset="100%" stop-color="#c68a15" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2ea44f" />
      <stop offset="50%" stop-color="#56d364" />
      <stop offset="100%" stop-color="#0077b5" />
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="850" fill="url(#bgGrad)" />
  
  <!-- Outer Ornate Frame -->
  <rect x="25" y="25" width="1150" height="800" rx="16" fill="none" stroke="#30363d" stroke-width="2" />
  <rect x="40" y="40" width="1120" height="770" rx="12" fill="none" stroke="url(#accentGrad)" stroke-width="1.5" stroke-dasharray="6,4" opacity="0.6" />
  <rect x="50" y="50" width="1100" height="750" rx="8" fill="#161b22" fill-opacity="0.4" stroke="#21262d" stroke-width="1" />

  <!-- Corner Flourishes -->
  <path d="M 65 105 L 65 65 L 105 65" fill="none" stroke="url(#goldGrad)" stroke-width="3" />
  <path d="M 1135 105 L 1135 65 L 1095 65" fill="none" stroke="url(#goldGrad)" stroke-width="3" />
  <path d="M 65 745 L 65 785 L 105 785" fill="none" stroke="url(#goldGrad)" stroke-width="3" />
  <path d="M 1135 745 L 1135 785 L 1095 785" fill="none" stroke="url(#goldGrad)" stroke-width="3" />

  <!-- Top Issuing Header -->
  <g transform="translate(600, 120)" text-anchor="middle">
    <!-- LinkedIn + GitHub Logos Badge -->
    <rect x="-180" y="-35" width="360" height="50" rx="25" fill="#0d1117" stroke="#30363d" stroke-width="1.5" />
    <text x="0" y="-3" fill="#e6edf3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" letter-spacing="3">
      LINKEDIN LEARNING  +  GITHUB
    </text>
    <text x="0" y="40" fill="#56d364" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" letter-spacing="2">
      PROFESSIONAL CERTIFICATE OF COMPLETION
    </text>
  </g>

  <!-- Salutation -->
  <text x="600" y="235" text-anchor="middle" fill="#8b949e" font-family="Georgia, serif" font-style="italic" font-size="20">
    This is to certify that
  </text>

  <!-- Recipient Name -->
  <text x="600" y="305" text-anchor="middle" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="800" letter-spacing="1">
    Kishor S V
  </text>
  
  <!-- Underline Gradient Bar -->
  <rect x="400" y="325" width="400" height="3" rx="1.5" fill="url(#accentGrad)" />

  <!-- Completion Statement -->
  <text x="600" y="375" text-anchor="middle" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18">
    has successfully completed the comprehensive professional program in
  </text>

  <!-- Certificate Title -->
  <g transform="translate(600, 440)" text-anchor="middle">
    <rect x="-420" y="-35" width="840" height="70" rx="14" fill="#0d1117" stroke="#30363d" stroke-width="1.5" />
    <text x="0" y="9" fill="url(#goldGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="26" font-weight="800" letter-spacing="0.5">
      Career Essentials in GitHub Professional Certificate
    </text>
  </g>

  <!-- Skills Box -->
  <g transform="translate(600, 545)" text-anchor="middle">
    <text x="0" y="0" fill="#7ee787" font-family="monospace" font-size="14" font-weight="600" letter-spacing="1">
      VALIDATED SKILLS &amp; COMPETENCIES
    </text>
    <text x="0" y="30" fill="#e6edf3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="500">
      GitHub • Version Control • Collaboration • Git Workflows • Branch Management • Repository Hygiene
    </text>
  </g>

  <!-- Footer Information (Issue Date, Seal, Signatures) -->
  <g transform="translate(140, 680)">
    <text x="0" y="0" fill="#8b949e" font-family="monospace" font-size="12" letter-spacing="1">ISSUE DATE</text>
    <text x="0" y="24" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700">February 4, 2026</text>
    <line x1="0" y1="36" x2="180" y2="36" stroke="#30363d" stroke-width="1" />
  </g>

  <!-- Center Verified Seal -->
  <g transform="translate(600, 690)" text-anchor="middle">
    <circle cx="0" cy="0" r="42" fill="#0d1117" stroke="url(#goldGrad)" stroke-width="2.5" />
    <circle cx="0" cy="0" r="36" fill="none" stroke="#2ea44f" stroke-width="1" stroke-dasharray="3,2" />
    <text x="0" y="-8" fill="url(#goldGrad)" font-family="monospace" font-size="10" font-weight="700">VERIFIED</text>
    <text x="0" y="8" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="800">GITHUB</text>
    <text x="0" y="22" fill="#7ee787" font-family="monospace" font-size="9">CERTIFIED</text>
  </g>

  <g transform="translate(880, 680)">
    <text x="180" y="0" text-anchor="end" fill="#8b949e" font-family="monospace" font-size="12" letter-spacing="1">AUTHORIZED ISSUER</text>
    <text x="180" y="24" text-anchor="end" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700">LinkedIn Learning &amp; GitHub</text>
    <line x1="0" y1="36" x2="180" y2="36" stroke="#30363d" stroke-width="1" />
  </g>
</svg>
