<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1280" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Studio Dark Vignette Background -->
    <radialGradient id="studioBg" cx="50%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#2a303c" />
      <stop offset="25%" stop-color="#1e232d" />
      <stop offset="55%" stop-color="#11141a" />
      <stop offset="85%" stop-color="#08090d" />
      <stop offset="100%" stop-color="#020304" />
    </radialGradient>

    <!-- Studio Rim Light Filter & Glow -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="hairRim" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feColorMatrix type="matrix" values="1 0 0 0 0.4  0 1 0 0 0.6  0 0 1 0 0.9  0 0 0 1 0" />
      <feBlend in="SourceGraphic" in2="blur" mode="screen" />
    </filter>

    <!-- Navy Suit Blazer Fabric Gradient -->
    <linearGradient id="suitNavyDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1b2536" />
      <stop offset="25%" stop-color="#131c2a" />
      <stop offset="70%" stop-color="#0c121c" />
      <stop offset="100%" stop-color="#05080d" />
    </linearGradient>

    <linearGradient id="suitNavyLight" x1="0%" y1="0%" x2="60%" y2="100%">
      <stop offset="0%" stop-color="#28374f" />
      <stop offset="40%" stop-color="#182335" />
      <stop offset="100%" stop-color="#090e18" />
    </linearGradient>

    <linearGradient id="lapelLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#30435f" />
      <stop offset="35%" stop-color="#1f2c40" />
      <stop offset="85%" stop-color="#101824" />
    </linearGradient>

    <linearGradient id="lapelRight" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#28374f" />
      <stop offset="35%" stop-color="#1a2536" />
      <stop offset="85%" stop-color="#0c121c" />
    </linearGradient>

    <!-- Sky Blue Shirt Gradients -->
    <linearGradient id="shirtMain" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="15%" stop-color="#e0f2fe" />
      <stop offset="50%" stop-color="#bae6fd" />
      <stop offset="85%" stop-color="#93c5fd" />
      <stop offset="100%" stop-color="#7dd3fc" />
    </linearGradient>

    <linearGradient id="shirtShadow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#93c5fd" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#60a5fa" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#1e3a8a" stop-opacity="0.6" />
    </linearGradient>

    <linearGradient id="collarLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#dbeafe" />
      <stop offset="100%" stop-color="#bfdbfe" />
    </linearGradient>

    <linearGradient id="collarRight" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="40%" stop-color="#dbeafe" />
      <stop offset="100%" stop-color="#93c5fd" />
    </linearGradient>

    <!-- Skin Tones -->
    <linearGradient id="skinBase" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#e2b48e" />
      <stop offset="28%" stop-color="#d19c72" />
      <stop offset="65%" stop-color="#b87b4e" />
      <stop offset="90%" stop-color="#94582f" />
      <stop offset="100%" stop-color="#6e3c1a" />
    </linearGradient>

    <radialGradient id="faceKeyLight" cx="48%" cy="42%" r="55%">
      <stop offset="0%" stop-color="#f0c8a6" />
      <stop offset="35%" stop-color="#dfa87e" />
      <stop offset="70%" stop-color="#c18354" />
      <stop offset="100%" stop-color="#8e5127" />
    </radialGradient>

    <linearGradient id="neckShadow" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#663614" />
      <stop offset="40%" stop-color="#82461d" />
      <stop offset="100%" stop-color="#aa6c3e" />
    </linearGradient>

    <!-- Hair Volume Gradients -->
    <linearGradient id="hairDark" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#2d221e" />
      <stop offset="25%" stop-color="#1b1411" />
      <stop offset="60%" stop-color="#0e0b0a" />
      <stop offset="100%" stop-color="#040303" />
    </linearGradient>

    <linearGradient id="hairHighlight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3d2f2a" stop-opacity="0" />
      <stop offset="30%" stop-color="#5a453e" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#73584e" stop-opacity="0.9" />
      <stop offset="70%" stop-color="#4e3b34" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#2d221e" stop-opacity="0" />
    </linearGradient>

    <!-- Rim Light on Shoulders -->
    <linearGradient id="rimLightL" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#93c5fd" stop-opacity="0.85" />
      <stop offset="30%" stop-color="#60a5fa" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="rimLightR" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#93c5fd" stop-opacity="0.85" />
      <stop offset="30%" stop-color="#60a5fa" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Studio Background -->
  <rect width="720" height="1280" fill="url(#studioBg)" />

  <!-- Soft Ambient Backlight Glow behind Subject -->
  <circle cx="360" cy="420" r="320" fill="#3b82f6" opacity="0.12" filter="url(#softGlow)" />
  <circle cx="360" cy="300" r="180" fill="#818cf8" opacity="0.08" filter="url(#softGlow)" />

  <!-- ==================== BODY & CLOTHING ==================== -->
  <g id="body">
    <!-- Trousers / Waistband (Hands in Pockets Pose) -->
    <path d="M210 990 L210 1280 L510 1280 L510 990 Z" fill="#090d14" />
    <!-- Trousers Shadow & Creases -->
    <path d="M350 1020 L350 1280 L370 1280 L370 1020 Z" fill="#040609" />
    <path d="M220 1000 Q280 1010 360 1012 Q440 1010 500 1000 L505 1030 Q440 1038 360 1040 Q280 1038 215 1030 Z" fill="#0d1117" />
    <!-- Belt & Silver Buckle -->
    <rect x="230" y="1004" width="260" height="20" rx="3" fill="#05070a" />
    <rect x="345" y="1000" width="30" height="28" rx="4" fill="none" stroke="#94a3b8" stroke-width="4" />
    <rect x="358" y="1004" width="4" height="20" fill="#cbd5e1" />

    <!-- Sky Blue Shirt Torso -->
    <path d="M285 430 Q360 450 435 430 L460 1020 Q360 1035 260 1020 Z" fill="url(#shirtMain)" />

    <!-- Shirt Vertical Placket & Buttons -->
    <path d="M350 440 L350 1025 L370 1025 L370 440 Z" fill="#e0f2fe" opacity="0.9" />
    <line x1="360" y1="440" x2="360" y2="1025" stroke="#bae6fd" stroke-width="1.5" />
    <!-- Shirt Buttons -->
    <circle cx="360" cy="530" r="4.5" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" />
    <circle cx="360" cy="620" r="4.5" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" />
    <circle cx="360" cy="710" r="4.5" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" />
    <circle cx="360" cy="800" r="4.5" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" />
    <circle cx="360" cy="890" r="4.5" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" />
    <circle cx="360" cy="970" r="4.5" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" />

    <!-- Shirt Chest Pocket Outline (Left Chest / Viewer's Right) -->
    <path d="M400 620 L445 620 L445 675 L422 690 L400 675 Z" fill="none" stroke="#7dd3fc" stroke-width="1.5" opacity="0.75" />

    <!-- Realistic Shirt Cloth Fold Shading -->
    <path d="M285 450 Q310 650 280 850 L320 850 Q335 650 315 450 Z" fill="url(#shirtShadow)" />
    <path d="M435 450 Q410 650 440 850 L400 850 Q385 650 405 450 Z" fill="url(#shirtShadow)" />
    <path d="M320 780 Q360 810 400 780 Q380 805 340 800 Z" fill="#60a5fa" opacity="0.3" />
    <path d="M315 880 Q360 910 405 880 Q380 905 340 900 Z" fill="#60a5fa" opacity="0.3" />

    <!-- Open Collar & Exposed Neck -->
    <!-- Neck Base & Trapezius muscles -->
    <path d="M315 320 L315 440 Q360 460 405 440 L405 320 Z" fill="url(#neckShadow)" />
    <path d="M330 330 Q360 410 390 330 Q360 350 330 330 Z" fill="#c18354" />
    <!-- Adam's Apple Shadow -->
    <ellipse cx="360" cy="360" rx="9" ry="12" fill="#7a3f1a" opacity="0.35" />

    <!-- Crisp Shirt Collar Wings (Unbuttoned Open Look) -->
    <!-- Left Collar (Viewer's Left) -->
    <path d="M320 380 L285 435 L345 445 L352 395 Z" fill="url(#collarLeft)" stroke="#bae6fd" stroke-width="1.5" />
    <path d="M285 435 L345 445 L340 452 L280 442 Z" fill="#93c5fd" opacity="0.5" />

    <!-- Right Collar (Viewer's Right) -->
    <path d="M400 380 L435 435 L375 445 L368 395 Z" fill="url(#collarRight)" stroke="#bae6fd" stroke-width="1.5" />
    <path d="M435 435 L375 445 L380 452 L440 442 Z" fill="#93c5fd" opacity="0.5" />

    <!-- ==================== NAVY SUIT BLAZER ==================== -->
    <!-- Left Blazer Sleeve & Shoulder (Viewer's Left) -->
    <path d="M280 400 Q190 430 130 520 Q80 640 70 820 Q65 940 120 1080 Q150 1110 180 1070 Q190 990 205 870 Q215 750 240 600 L285 435 Z" fill="url(#suitNavyDark)" />
    <!-- Left Shoulder Rim Light -->
    <path d="M280 400 Q190 430 130 520 Q80 640 70 820 L76 820 Q86 645 135 528 Q193 438 280 408 Z" fill="url(#rimLightL)" />

    <!-- Left Blazer Lapel -->
    <path d="M280 400 L240 580 L275 640 L210 820 L275 990 L320 990 L300 700 L325 435 Z" fill="url(#lapelLeft)" stroke="#111827" stroke-width="1.5" />
    <!-- Lapel Fold Highlight -->
    <line x1="280" y1="400" x2="240" y2="580" stroke="#475569" stroke-width="2" />
    <line x1="240" y1="580" x2="275" y2="640" stroke="#475569" stroke-width="2" />
    <line x1="275" y1="640" x2="210" y2="820" stroke="#475569" stroke-width="2" />

    <!-- Right Blazer Sleeve & Shoulder (Viewer's Right) -->
    <path d="M440 400 Q530 430 590 520 Q640 640 650 820 Q655 940 600 1080 Q570 1110 540 1070 Q530 990 515 870 Q505 750 480 600 L435 435 Z" fill="url(#suitNavyDark)" />
    <!-- Right Shoulder Rim Light -->
    <path d="M440 400 Q530 430 590 520 Q640 640 650 820 L644 820 Q634 645 585 528 Q527 438 440 408 Z" fill="url(#rimLightR)" />

    <!-- Right Blazer Lapel -->
    <path d="M440 400 L480 580 L445 640 L510 820 L445 990 L400 990 L420 700 L395 435 Z" fill="url(#lapelRight)" stroke="#111827" stroke-width="1.5" />
    <!-- Right Lapel Fold Highlight -->
    <line x1="440" y1="400" x2="480" y2="580" stroke="#475569" stroke-width="2" />
    <line x1="480" y1="580" x2="445" y2="640" stroke="#475569" stroke-width="2" />
    <line x1="445" y1="640" x2="510" y2="820" stroke="#475569" stroke-width="2" />

    <!-- Hands In Pockets Detail & Wrists -->
    <!-- Left Hand & White Cuff into pocket -->
    <path d="M120 1050 L140 1080 L185 1060 L165 1030 Z" fill="#ffffff" />
    <path d="M130 1060 Q170 1120 220 1050 Q230 1020 200 1000 Z" fill="url(#skinBase)" />

    <!-- Right Hand & White Cuff into pocket -->
    <path d="M600 1050 L580 1080 L535 1060 L555 1030 Z" fill="#ffffff" />
    <path d="M590 1060 Q550 1120 500 1050 Q490 1020 520 1000 Z" fill="url(#skinBase)" />

    <!-- Blazer Lower Tail Outline -->
    <path d="M210 820 L210 990 L275 990 L275 820 Z" fill="#0d1420" />
    <path d="M510 820 L510 990 L445 990 L445 820 Z" fill="#0d1420" />
  </g>

  <!-- ==================== HEAD, FACE & HAIR ==================== -->
  <g id="head">
    <!-- Neck & Jaw Shadow -->
    <path d="M305 270 Q360 360 415 270 L410 350 Q360 380 310 350 Z" fill="#663412" />

    <!-- Ear Left (Viewer's Left) with Shiny Stud Earring -->
    <path d="M285 220 Q265 240 270 275 Q276 300 295 305 L300 250 Z" fill="url(#skinBase)" />
    <path d="M280 240 Q272 260 278 280 Q285 285 292 275" fill="none" stroke="#87471d" stroke-width="2" />
    <!-- Silver/Diamond Stud Earring on Right Ear (Viewer's Left) -->
    <circle cx="282" cy="288" r="4.5" fill="#f8fafc" stroke="#64748b" stroke-width="1.5" />
    <circle cx="281" cy="287" r="2" fill="#38bdf8" />
    <circle cx="280" cy="286" r="1.2" fill="#ffffff" />

    <!-- Ear Right (Viewer's Right) -->
    <path d="M435 220 Q455 240 450 275 Q444 300 425 305 L420 250 Z" fill="url(#skinBase)" />
    <path d="M440 240 Q448 260 442 280 Q435 285 428 275" fill="none" stroke="#87471d" stroke-width="2" />

    <!-- Head & Face Structure -->
    <path d="M290 190 Q290 130 360 130 Q430 130 430 190 Q435 260 415 310 Q385 365 360 365 Q335 365 305 310 Q285 260 290 190 Z" fill="url(#faceKeyLight)" />

    <!-- Cheek & Jaw Shading -->
    <!-- Left Cheek Shading -->
    <path d="M290 200 Q290 270 320 325 Q305 280 300 220 Z" fill="#8c4e23" opacity="0.45" />
    <!-- Right Cheek Shading -->
    <path d="M430 200 Q430 270 400 325 Q415 280 420 220 Z" fill="#8c4e23" opacity="0.45" />
    <!-- Chin Highlight -->
    <ellipse cx="360" cy="342" rx="16" ry="10" fill="#f3cead" opacity="0.6" />
    <!-- Forehead Highlight -->
    <ellipse cx="360" cy="180" rx="36" ry="20" fill="#f8d7b9" opacity="0.5" />

    <!-- Nose Structure -->
    <path d="M358 180 L355 265 Q350 278 342 280 Q352 286 360 286 Q368 286 378 280 Q370 278 365 265 L362 180 Z" fill="#8a4b20" opacity="0.35" />
    <!-- Nose Tip Highlight -->
    <ellipse cx="360" cy="275" rx="7" ry="5.5" fill="#f8d7b9" opacity="0.75" />
    <!-- Nostrils -->
    <ellipse cx="349" cy="281" rx="4" ry="2.5" fill="#4d240b" />
    <ellipse cx="371" cy="281" rx="4" ry="2.5" fill="#4d240b" />

    <!-- Eyes & Eyebrows -->
    <!-- Left Eyebrow -->
    <path d="M312 205 Q335 194 350 202 Q335 198 312 205 Z" fill="#140f0d" stroke="#140f0d" stroke-width="5" stroke-linecap="round" />
    <!-- Right Eyebrow -->
    <path d="M408 205 Q385 194 370 202 Q385 198 408 205 Z" fill="#140f0d" stroke="#140f0d" stroke-width="5" stroke-linecap="round" />

    <!-- Left Eye -->
    <path d="M316 222 Q334 214 350 224 Q334 232 316 222 Z" fill="#ffffff" />
    <circle cx="334" cy="222" r="7" fill="#1b120c" />
    <circle cx="334" cy="222" r="3.5" fill="#050302" />
    <circle cx="332" cy="220" r="1.8" fill="#ffffff" />
    <path d="M314 221 Q334 212 352 222" fill="none" stroke="#1b120c" stroke-width="2.5" stroke-linecap="round" />
    <!-- Left Under-eye soft contour -->
    <path d="M320 228 Q334 233 346 228" fill="none" stroke="#87471d" stroke-width="1.2" opacity="0.4" />

    <!-- Right Eye -->
    <path d="M404 222 Q386 214 370 224 Q386 232 404 222 Z" fill="#ffffff" />
    <circle cx="386" cy="222" r="7" fill="#1b120c" />
    <circle cx="386" cy="222" r="3.5" fill="#050302" />
    <circle cx="384" cy="220" r="1.8" fill="#ffffff" />
    <path d="M406 221 Q386 212 368 222" fill="none" stroke="#1b120c" stroke-width="2.5" stroke-linecap="round" />
    <!-- Right Under-eye soft contour -->
    <path d="M400 228 Q386 233 374 228" fill="none" stroke="#87471d" stroke-width="1.2" opacity="0.4" />

    <!-- Mustache (Neat, Trimmed Thin Style matching photo) -->
    <path d="M336 303 Q348 296 360 298 Q372 296 384 303 Q372 307 360 304 Q348 307 336 303 Z" fill="#17110e" stroke="#17110e" stroke-width="2.5" stroke-linejoin="round" />

    <!-- Lips & Confident Subtle Smile -->
    <path d="M338 312 Q360 310 382 312 Q360 318 338 312 Z" fill="#a4593c" />
    <path d="M342 314 Q360 326 378 314 Q360 321 342 314 Z" fill="#ba6c4c" />
    <line x1="337" y1="312" x2="383" y2="312" stroke="#5a2211" stroke-width="1.5" />

    <!-- Goatee / Chin Beard (Neat Patch on Chin) -->
    <path d="M352 328 Q360 325 368 328 L366 352 Q360 358 354 352 Z" fill="#140f0c" opacity="0.9" />

    <!-- ==================== STYLISH VOLUME QUIFF / POMPADOUR HAIR ==================== -->
    <!-- Base Hair Silhouette & Tapered Sides -->
    <path d="M280 230 Q270 170 290 120 Q310 70 360 60 Q410 70 430 120 Q450 170 440 230 Q430 180 420 150 Q360 120 300 150 Q290 180 280 230 Z" fill="url(#hairDark)" />

    <!-- Voluminous Textured Quiff Top -->
    <path d="M285 140 Q280 80 330 50 Q360 40 400 48 Q445 60 445 125 Q450 100 435 68 Q395 35 345 42 Q295 50 285 140 Z" fill="#2d221e" />
    
    <!-- Hair Strands & Natural Textured Flow -->
    <path d="M300 130 Q320 60 360 55 Q400 60 425 110" fill="none" stroke="#3d2f2a" stroke-width="8" stroke-linecap="round" />
    <path d="M315 120 Q335 70 370 65 Q405 70 420 100" fill="none" stroke="#4a3933" stroke-width="6" stroke-linecap="round" />
    <path d="M330 110 Q350 75 380 72 Q410 80 415 95" fill="none" stroke="#5c473f" stroke-width="4" stroke-linecap="round" />
    <path d="M295 105 Q325 55 365 50 Q405 55 435 90" fill="none" stroke="#241a16" stroke-width="5" stroke-linecap="round" />

    <!-- Studio Rim Light on Hair Contour (Left & Right Hair Glow) -->
    <path d="M280 140 Q285 70 340 45 Q385 40 435 60 Q445 100 445 150" fill="none" stroke="#60a5fa" stroke-width="3" opacity="0.55" filter="url(#hairRim)" />
    <path d="M340 45 Q385 40 435 60" fill="none" stroke="#bae6fd" stroke-width="2" opacity="0.8" />
  </g>
</svg>
