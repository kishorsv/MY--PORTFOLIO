<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Dark Studio Vignette Background -->
    <radialGradient id="avBg" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#242b36" />
      <stop offset="50%" stop-color="#131720" />
      <stop offset="100%" stop-color="#05070a" />
    </radialGradient>

    <!-- Glowing Rim Light -->
    <filter id="avGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Navy Blazer Gradient -->
    <linearGradient id="avBlazer" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="40%" stop-color="#111827" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <!-- Sky Blue Shirt Gradient -->
    <linearGradient id="avShirt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="30%" stop-color="#e0f2fe" />
      <stop offset="70%" stop-color="#bae6fd" />
      <stop offset="100%" stop-color="#93c5fd" />
    </linearGradient>

    <!-- Skin Tones -->
    <radialGradient id="avFace" cx="48%" cy="42%" r="55%">
      <stop offset="0%" stop-color="#f0c8a6" />
      <stop offset="40%" stop-color="#dfa87e" />
      <stop offset="75%" stop-color="#c18354" />
      <stop offset="100%" stop-color="#8e5127" />
    </radialGradient>
  </defs>

  <rect width="500" height="500" rx="250" fill="url(#avBg)" />

  <!-- Rim light aura behind head -->
  <circle cx="250" cy="230" r="140" fill="#38bdf8" opacity="0.15" filter="url(#avGlow)" />

  <!-- Navy Blazer Shoulders -->
  <path d="M70 500 Q130 380 200 370 L300 370 Q370 380 430 500 Z" fill="url(#avBlazer)" />
  <path d="M70 500 Q130 380 200 370" fill="none" stroke="#60a5fa" stroke-width="2.5" opacity="0.6" />
  <path d="M430 500 Q370 380 300 370" fill="none" stroke="#60a5fa" stroke-width="2.5" opacity="0.6" />

  <!-- Sky Blue Shirt Torso -->
  <path d="M200 370 L250 500 L300 370 Z" fill="url(#avShirt)" />
  <line x1="250" y1="380" x2="250" y2="500" stroke="#bae6fd" stroke-width="2" />
  <circle cx="250" cy="440" r="3.5" fill="#ffffff" stroke="#94a3b8" stroke-width="1" />

  <!-- Shirt Collars -->
  <path d="M210 325 L180 375 L235 385 L242 340 Z" fill="#ffffff" stroke="#bae6fd" stroke-width="1.5" />
  <path d="M290 325 L320 375 L265 385 L258 340 Z" fill="#e0f2fe" stroke="#bae6fd" stroke-width="1.5" />

  <!-- Neck & Shadow -->
  <path d="M215 270 L215 360 Q250 380 285 360 L285 270 Z" fill="#7a3f1a" />
  <ellipse cx="250" cy="315" rx="8" ry="10" fill="#663412" opacity="0.4" />

  <!-- Left Ear + Stud Earring -->
  <path d="M190 200 Q175 215 180 240 Q185 260 200 265 Z" fill="#c18354" />
  <circle cx="187" cy="252" r="3.5" fill="#f8fafc" stroke="#64748b" stroke-width="1" />
  <circle cx="186" cy="251" r="1.5" fill="#38bdf8" />

  <!-- Right Ear -->
  <path d="M310 200 Q325 215 320 240 Q315 260 300 265 Z" fill="#c18354" />

  <!-- Face -->
  <path d="M195 180 Q195 130 250 130 Q305 130 305 180 Q310 240 295 280 Q270 325 250 325 Q230 325 205 280 Q190 240 195 180 Z" fill="url(#avFace)" />

  <!-- Forehead highlight -->
  <ellipse cx="250" cy="170" rx="28" ry="16" fill="#f8d7b9" opacity="0.4" />
  <!-- Chin highlight -->
  <ellipse cx="250" cy="305" rx="14" ry="8" fill="#f3cead" opacity="0.5" />

  <!-- Nose -->
  <path d="M248 175 L246 242 Q240 253 234 255 Q243 260 250 260 Q257 260 266 255 Q260 253 254 242 L252 175 Z" fill="#8a4b20" opacity="0.3" />
  <ellipse cx="250" cy="252" rx="6" ry="4.5" fill="#f8d7b9" opacity="0.7" />
  <ellipse cx="241" cy="256" rx="3" ry="2" fill="#4d240b" />
  <ellipse cx="259" cy="256" rx="3" ry="2" fill="#4d240b" />

  <!-- Eyebrows -->
  <path d="M212 195 Q230 186 242 193" fill="none" stroke="#140f0d" stroke-width="4.5" stroke-linecap="round" />
  <path d="M288 195 Q270 186 258 193" fill="none" stroke="#140f0d" stroke-width="4.5" stroke-linecap="round" />

  <!-- Eyes -->
  <path d="M216 210 Q230 203 242 211 Q230 218 216 210 Z" fill="#ffffff" />
  <circle cx="230" cy="210" r="5.5" fill="#1b120c" />
  <circle cx="229" cy="209" r="1.5" fill="#ffffff" />

  <path d="M284 210 Q270 203 258 211 Q270 218 284 210 Z" fill="#ffffff" />
  <circle cx="270" cy="210" r="5.5" fill="#1b120c" />
  <circle cx="269" cy="209" r="1.5" fill="#ffffff" />

  <!-- Mustache -->
  <path d="M230 274 Q240 269 250 271 Q260 269 270 274 Q260 277 250 275 Q240 277 230 274 Z" fill="#17110e" stroke="#17110e" stroke-width="2" stroke-linejoin="round" />

  <!-- Lips -->
  <path d="M232 282 Q250 280 268 282 Q250 287 232 282 Z" fill="#a4593c" />
  <path d="M235 284 Q250 293 265 284" fill="none" stroke="#ba6c4c" stroke-width="2.5" />

  <!-- Goatee on Chin -->
  <path d="M244 294 Q250 292 256 294 L255 314 Q250 318 245 314 Z" fill="#140f0c" opacity="0.9" />

  <!-- Voluminous Quiff / Pompadour Hair -->
  <path d="M190 200 Q180 150 195 110 Q210 70 250 62 Q290 70 305 110 Q320 150 310 200 Q300 160 295 135 Q250 110 205 135 Q200 160 190 200 Z" fill="#1b1411" />
  <path d="M192 120 Q188 70 228 45 Q250 36 280 42 Q315 52 318 105 Q320 85 308 60 Q278 30 240 36 Q200 42 192 120 Z" fill="#2d221e" />

  <!-- Hair Texture & Highlights -->
  <path d="M205 110 Q220 52 250 48 Q280 52 300 95" fill="none" stroke="#4a3933" stroke-width="5" stroke-linecap="round" />
  <path d="M215 100 Q230 62 258 58 Q285 62 295 85" fill="none" stroke="#5c473f" stroke-width="3" stroke-linecap="round" />
  <path d="M188 120 Q192 60 235 38 Q270 34 310 50 Q318 85 318 125" fill="none" stroke="#60a5fa" stroke-width="2.5" opacity="0.6" />
</svg>
